# PLANIFICADOR ACADEMICO PED941
# UNIVERSIDAD DON BOSCO

spring.application.name=PlanificadorAcademicoPED941

# SERVIDOR WEB
server.port=8080
server.address=127.0.0.1

# BASE DE DATOS H2 PERSISTENTE
spring.datasource.url=jdbc:h2:file:./data/planificador
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# INICIALIZACION DE BASE DE DATOS
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# CONFIGURACION THYMELEAF
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# REGISTRO DE EVENTOS
logging.level.root=INFO
logging.level.sv.edu.udb.ped941=INFO
